# The virtual cameras omavcam writes. Override by putting your own file in
# /etc/modprobe.d, which wins over this one.
#
# devices=2, because uncropped frames must never reach the node applications
# consume (ADR-0009): the public `omavcam` node, and `omavcam-studio` for
# Studio's uncropped preview.
#
# No label holds a space, and none is quoted. The kernel's next_arg() strips
# quotes only when the whole value starts with one, and param_array_set then
# splits the value on `,` with no quote handling at all — so
# card_label=omavcam,omavcam-studio yields a second label containing the
# quote characters themselves. #17 measured a shell command line, where the
# shell had already removed them; a modprobe.d file has no shell.
#
# exclusive_caps=1 on every node is not optional (ADR-0012). A node created
# with exclusive_caps=0 advertises capture and output at once, which makes
# browsers refuse to list it and makes it unreadable: ffmpeg fails at
# VIDIOC_STREAMON. It is also what keeps an idle node out of camera lists.
#
# video_nr is a request, not a guarantee — another device can already hold the
# number — so omavcam finds its node by card_label and never by path.
#
# max_buffers above the default 2 costs nothing and gives the writer room.
options v4l2loopback devices=2 video_nr=42,43 card_label=omavcam,omavcam-studio exclusive_caps=1,1 max_buffers=4
