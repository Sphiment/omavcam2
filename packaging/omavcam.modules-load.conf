# Loaded at boot, because a `systemd --user` daemon has no CAP_SYS_MODULE and
# nothing in omavcam ever calls modprobe (ADR-0008). Its parameters are in
# /usr/lib/modprobe.d/omavcam.conf.
#
# An always-present node costs nothing: with exclusive_caps=1 an idle node
# advertises output only, so an idle omavcam is in nobody's camera list.
v4l2loopback
